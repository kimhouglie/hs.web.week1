<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {color:aquamarine}
        
    </style>
</head>
<body>
    <h1 id="str">글자</h1>
    <button id="bt">눌러</button>
    <script>
        document.querySelector('#bt').addEventListener('click', function() {
            document.querySelector('#str').textContent='변경';
        });
    </script>
</body>
</html>
